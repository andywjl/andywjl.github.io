services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: globe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: globe
    command: >
      bash -lc "
        apt-get update &&
        apt-get install -y postgresql-16-pgvector &&
        printf 'CREATE EXTENSION IF NOT EXISTS postgis;\nCREATE EXTENSION IF NOT EXISTS vector;\n' > /docker-entrypoint-initdb.d/00-extensions.sql &&
        docker-entrypoint.sh postgres
      "
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globe"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
